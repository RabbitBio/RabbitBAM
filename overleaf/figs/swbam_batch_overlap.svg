<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="111.25000mm" viewBox="0 0 1440 900">
<title>Batch-level overlap between MPE and CPE execution</title>
<desc>Batch-level overlap between MPE and CPE execution. Academic method schematic.</desc>
<rect width="1440" height="900" fill="white"/>
<g id="Read title">
<text x="28.000" y="45.100" text-anchor="start" font-family="Arial, Liberation Sans, sans-serif" font-size="26" font-weight="700" fill="#222B33">(a) BAM read: next-batch input overlaps current CPE work</text>
</g>
<g id="Read time">
<line x1="180" y1="87" x2="1391.0" y2="87.0" stroke="#6F7B84" stroke-width="1.8"/>
<polygon points="1400,87 1391.0,90.7 1391.0,83.3" fill="#6F7B84"/>
</g>
<g id="Read time label">
<text x="1294.000" y="75.350" text-anchor="middle" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="400" fill="#4E5B64">Time (schematic)</text>
</g>
<g id="Read MPE lane">
<text x="32.000" y="185.600" text-anchor="start" font-family="Arial, Liberation Sans, sans-serif" font-size="26" font-weight="700" fill="#222B33">MPE</text>
</g>
